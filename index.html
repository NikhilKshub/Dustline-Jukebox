<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dustline Jukebox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Phantasm</h1>
        <P>Letting the spirits of old vinyl breathe back into the room.</P>
    </header>
    <section id="now-playing">
        <p>Now playing</p>
        <span id="np-code">A3</span>
        <h2 id="np-title">Nothing playing</h2>
        <p id="np-artist">Nothing playing</p>
        <div class="progress-row">
            <span id="time-now">0:00</span>
            <div class="bar">
                <div class="bar-fill"></div>
            </div>
            <span id="time-total">0:00</span>
        </div>
        <audio id="player"></audio>
    </section>















    
    <script src="script.js"></script>
</body>
</html>
